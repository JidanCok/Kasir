window.storage = {
  async get(key, shared) {
    try {
      const v = localStorage.getItem('kasir_' + key);
      return v !== null ? { key, value: v, shared: !!shared } : null;
    } catch (e) { return null; }
  },
  async set(key, value, shared) {
    try {
      localStorage.setItem('kasir_' + key, value);
      return { key, value, shared: !!shared };
    } catch (e) { return null; }
  },
  async delete(key, shared) {
    try { localStorage.removeItem('kasir_' + key); return { key, deleted: true, shared: !!shared }; }
    catch (e) { return null; }
  },
  async list(prefix, shared) {
    try {
      const keys = Object.keys(localStorage).filter(k => k.startsWith('kasir_' + (prefix || ''))).map(k => k.replace('kasir_', ''));
      return { keys, prefix, shared: !!shared };
    } catch (e) { return null; }
  }
};

const SEED_PRODUCTS = [
  { id: uid(), name: 'Americano', price: 10000, stock: 20, category: 'Coffee' },
  { id: uid(), name: 'Cappuccino', price: 15000, stock: 20, category: 'Coffee' },

function KasirApp() {
  const [ready, setReady] = useState(false);
  const [products, setProducts] = useState([]);
  const [transactions, setTransactions] = useState([]);
  const [activeTab, setActiveTab] = useState('kasir');

  // kasir state
  const [cart, setCart] = useState([]);
  const [search, setSearch] = useState('');
  const [activeCategory, setActiveCategory] = useState('Semua');
  const [cashInput, setCashInput] = useState('');
  const [discountInput, setDiscountInput] = useState('');
  const [lastTransaction, setLastTransaction] = useState(null);
  const [showReceipt, setShowReceipt] = useState(false);

  // produk state
  const [productModal, setProductModal] = useState(null); // null | 'new' | product object
  const [pForm, setPForm] = useState({ name: '', price: '', stock: '', category: '' });

  // riwayat state
  const [expandedTrx, setExpandedTrx] = useState(null);

  const [saveError, setSaveError] = useState(false);

  // pengaturan toko
  const [storeSettings, setStoreSettings] = useState({ name: '', logo: null });
  const [showSettings, setShowSettings] = useState(false);
  const [settingsForm, setSettingsForm] = useState({ name: '', logo: null });

  // ---- load data ----
  useEffect(() => {
    (async () => {
      let loadedProducts = SEED_PRODUCTS;
      let loadedTransactions = [];
      try {
        const p = await window.storage.get('products');
        if (p && p.value) loadedProducts = JSON.parse(p.value);
      } catch (e) { /* no existing products, keep seed */ }
      try {
        const t = await window.storage.get('transactions');
        if (t && t.value) loadedTransactions = JSON.parse(t.value);
      } catch (e) { /* none yet */ }
      let loadedSettings = { name: '', logo: null };
      try {
        const s = await window.storage.get('store-settings');
        if (s && s.value) loadedSettings = JSON.parse(s.value);
      } catch (e) { /* none yet */ }
      setProducts(loadedProducts);
      setTransactions(loadedTransactions);
      setStoreSettings(loadedSettings);
      setSettingsForm(loadedSettings);
      setReady(true);
      // persist seed if this was a first run
      try {
        const existing = await window.storage.get('products');
        if (!existing) await window.storage.set('products', JSON.stringify(loadedProducts));
      } catch (e) { /* ignore */ }
    })();
  }, []);

  const saveProducts = async (next) => {
    setProducts(next);
    try {
      const res = await window.storage.set('products', JSON.stringify(next));
      if (!res) setSaveError(true);
    } catch (e) { setSaveError(true); }
  };

  const saveStoreSettings = async (next) => {
    setStoreSettings(next);
    try {
      const res = await window.storage.set('store-settings', JSON.stringify(next));
      if (!res) setSaveError(true);
    } catch (e) { setSaveError(true); }
  };

  const handleLogoUpload = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => setSettingsForm(f => ({ ...f, logo: reader.result }));
    reader.readAsDataURL(file);
  };

  const submitSettings = async () => {
    await saveStoreSettings(settingsForm);
    setShowSettings(false);
  };

  const saveTransactions = async (next) => {
    setTransactions(next);
    try {
      const res = await window.storage.set('transactions', JSON.stringify(next));
      if (!res) setSaveError(true);
    } catch (e) { setSaveError(true); }
  };

  // ---- kasir logic ----
  const categories = useMemo(() => {
    const set = new Set(products.map(p => p.category).filter(Boolean));
    return ['Semua', ...Array.from(set)];
  }, [products]);

  const filteredProducts = useMemo(() => {
    return products.filter(p => {
      const matchesSearch = p.name.toLowerCase().includes(search.toLowerCase());
      const matchesCategory = activeCategory === 'Semua' || p.category === activeCategory;
      return matchesSearch && matchesCategory;
    });
  }, [products, search, activeCategory]);

  const groupedProducts = useMemo(() => {
    const groups = {};
    filteredProducts.forEach(p => {
      const cat = p.category || 'Lainnya';
      if (!groups[cat]) groups[cat] = [];
      groups[cat].push(p);
    });
    // urutkan grup sesuai urutan kategori yang sudah ada, bukan acak
    return categories.filter(c => c !== 'Semua' && groups[c]).map(cat => ({ category: cat, items: groups[cat] }));
  }, [filteredProducts, categories]);

  const addToCart = (product) => {
    setCart(prev => {
      const existing = prev.find(c => c.productId === product.id);
      if (existing) {
        if (existing.qty >= product.stock) return prev;
        return prev.map(c => c.productId === product.id ? { ...c, qty: c.qty + 1 } : c);
      }
      if (product.stock <= 0) return prev;
      return [...prev, { productId: product.id, name: product.name, price: product.price, qty: 1, stock: product.stock }];
    });
  };

  const changeQty = (productId, delta) => {
    setCart(prev => prev.map(c => {
      if (c.productId !== productId) return c;
      const newQty = c.qty + delta;
      if (newQty < 1) return c;
      if (newQty > c.stock) return c;
      return { ...c, qty: newQty };
    }));
  };

  const removeFromCart = (productId) => {
    setCart(prev => prev.filter(c => c.productId !== productId));
  };

  const cartTotal = useMemo(() => cart.reduce((sum, c) => sum + c.price * c.qty, 0), [cart]);
  const discountPercent = Math.min(100, Math.max(0, parseFloat(discountInput) || 0));
  const discountAmount = cartTotal * (discountPercent / 100);
  const finalTotal = cartTotal - discountAmount;
  const cashValue = parseFloat(cashInput) || 0;
  const change = cashValue - finalTotal;
  const canCheckout = cart.length > 0 && cashValue >= finalTotal;

  const checkout = async () => {
    if (!canCheckout) return;
    const trx = {
      id: uid().toUpperCase(),
      timestamp: Date.now(),
      items: cart.map(c => ({ name: c.name, price: c.price, qty: c.qty })),
      subtotal: cartTotal,
      discountPercent: discountPercent,
      discountAmount: discountAmount,
      total: finalTotal,
      cash: cashValue,
      change: change,
    };
    const nextTransactions = [trx, ...transactions];
    const nextProducts = products.map(p => {
      const inCart = cart.find(c => c.productId === p.id);
      if (!inCart) return p;
      return { ...p, stock: Math.max(0, p.stock - inCart.qty) };
    });
    await saveTransactions(nextTransactions);
    await saveProducts(nextProducts);
    setLastTransaction(trx);
    setCart([]);
    setCashInput('');
    setDiscountInput('');
    setShowReceipt(true);
  };

  // ---- produk logic ----
  const openNewProduct = () => {
    setPForm({ name: '', price: '', stock: '', category: '' });
    setProductModal('new');
  };
  const openEditProduct = (p) => {
    setPForm({ name: p.name, price: String(p.price), stock: String(p.stock), category: p.category || '' });
    setProductModal(p);
  };
  const closeProductModal = () => setProductModal(null);

  const submitProduct = async () => {
    if (!pForm.name.trim() || pForm.price === '' || pForm.stock === '') return;
    const payload = {
      name: pForm.name.trim(),
      price: Math.max(0, parseFloat(pForm.price) || 0),
      stock: Math.max(0, parseInt(pForm.stock) || 0),
      category: pForm.category.trim() || 'Lainnya',
    };
    if (productModal === 'new') {
      await saveProducts([...products, { id: uid(), ...payload }]);
    } else {
      await saveProducts(products.map(p => p.id === productModal.id ? { ...p, ...payload } : p));
    }
    closeProductModal();
  };

  const deleteProduct = async (id) => {
    await saveProducts(products.filter(p => p.id !== id));
  };

  // ---- riwayat logic ----
  const todayStart = new Date(); todayStart.setHours(0, 0, 0, 0);
  const todaysTransactions = transactions.filter(t => t.timestamp >= todayStart.getTime());
  const todaysRevenue = todaysTransactions.reduce((s, t) => s + t.total, 0);

  const itemSalesSummary = useMemo(() => {
    const map = {};
    transactions.forEach(t => {
      const isToday = t.timestamp >= todayStart.getTime();
      t.items.forEach(it => {
        if (!map[it.name]) map[it.name] = { name: it.name, today: 0, allTime: 0 };
        map[it.name].allTime += it.qty;
        if (isToday) map[it.name].today += it.qty;
      });
    });
    return Object.values(map).sort((a, b) => b.allTime - a.allTime);
  }, [transactions]);

  const transactionsByDate = useMemo(() => {
    const groups = [];
    let current = null;
    transactions.forEach(t => {
      const d = new Date(t.timestamp);
      const dateKey = d.toDateString();
      if (!current || current.dateKey !== dateKey) {
        const label = d.toLocaleDateString('id-ID', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
        current = { dateKey, label, items: [], total: 0, itemMap: {} };
        groups.push(current);
      }
      current.items.push(t);
      current.total += t.total;
      t.items.forEach(it => {
        if (!current.itemMap[it.name]) current.itemMap[it.name] = { name: it.name, qty: 0, total: 0 };
        current.itemMap[it.name].qty += it.qty;
        current.itemMap[it.name].total += it.price * it.qty;
      });
    });
    return groups.map(g => ({ ...g, itemBreakdown: Object.values(g.itemMap).sort((a, b) => b.qty - a.qty) }));
  }, [transactions]);

  const printReceipt = () => {
    window.print();
  };

  const generateReceiptImage = (trx, settings) => new Promise((resolve) => {
    const width = 380;
    const padding = 24;
    const estHeight = padding * 2 + 150 + trx.items.length * 34 + 160 + (settings.logo ? 70 : 0);
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = estHeight;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, width, estHeight);
    ctx.fillStyle = '#20261F';

    const dashedLine = (y) => {
      ctx.strokeStyle = '#D6CFBE';
      ctx.beginPath(); ctx.setLineDash([3, 3]);
      ctx.moveTo(padding, y); ctx.lineTo(width - padding, y); ctx.stroke();
      ctx.setLineDash([]);
    };

    const drawBody = (startY) => {
      let y = startY;
      ctx.textAlign = 'center';
      ctx.font = '700 18px monospace';
      ctx.fillStyle = '#20261F';
      ctx.fillText(settings.name || 'Toko Saya', width / 2, y);
      y += 20;
      ctx.font = '12px monospace';
      ctx.fillStyle = '#6B7268';
      ctx.fillText(formatDateTime(trx.timestamp), width / 2, y);
      y += 16;
      ctx.fillText('No. #' + trx.id, width / 2, y);
      y += 14;
      dashedLine(y);
      y += 20;
      trx.items.forEach(it => {
        ctx.textAlign = 'left'; ctx.font = '13px monospace'; ctx.fillStyle = '#20261F';
        ctx.fillText(it.name, padding, y);
        ctx.textAlign = 'right';
        ctx.fillText(formatRupiah(it.price * it.qty), width - padding, y);
        y += 15;
        ctx.textAlign = 'left'; ctx.font = '11px monospace'; ctx.fillStyle = '#6B7268';
        ctx.fillText(`${it.qty} x ${formatRupiah(it.price)}`, padding, y);
        y += 19;
      });
      dashedLine(y);
      y += 22;
      ctx.textAlign = 'left'; ctx.font = '700 14px monospace'; ctx.fillStyle = '#20261F';
      ctx.fillText('Total', padding, y);
      ctx.textAlign = 'right';
      ctx.fillText(formatRupiah(trx.total), width - padding, y);
      y += 20;
      ctx.font = '12px monospace'; ctx.fillStyle = '#6B7268';
      ctx.textAlign = 'left'; ctx.fillText('Tunai', padding, y);
      ctx.textAlign = 'right'; ctx.fillText(formatRupiah(trx.cash), width - padding, y);
      y += 16;
      ctx.textAlign = 'left'; ctx.fillText('Kembali', padding, y);
      ctx.textAlign = 'right'; ctx.fillText(formatRupiah(trx.change), width - padding, y);
      y += 26;
      ctx.textAlign = 'center'; ctx.font = '11px monospace';
      ctx.fillText('Terima kasih atas kunjungan Anda', width / 2, y);
      resolve(canvas.toDataURL('image/png'));
    };

    if (settings.logo) {
      const img = new Image();
      img.onload = () => {
        const s = 56;
        ctx.drawImage(img, width / 2 - s / 2, padding, s, s);
        drawBody(padding + s + 22);
      };
      img.onerror = () => drawBody(padding + 10);
      img.src = settings.logo;
    } else {
      drawBody(padding + 10);
    }
  });

  const shareOrSaveReceipt = async () => {
    if (!lastTransaction) return;
    const dataUrl = await generateReceiptImage(lastTransaction, storeSettings);
    try {
      const blob = await (await fetch(dataUrl)).blob();
      const file = new File([blob], `struk-${lastTransaction.id}.png`, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Struk Transaksi' });
        return;
      }
    } catch (e) { /* fall back to download below */ }
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = `struk-${lastTransaction.id}.png`;
    a.click();
  };

  const formatDateTime = (ts) => {
    const d = new Date(ts);
    return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) +
      ' · ' + d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
  };

  if (!ready) {
    return (
      <div className="kasir-app" style={{ alignItems: 'center', justifyContent: 'center' }}>
        <style>{STYLE}</style>
        <p style={{ color: '#6B7268', fontFamily: 'IBM Plex Sans, sans-serif' }}>Memuat data...</p>
      </div>
    );
  }

  return (
    <div className="kasir-app">
      <style>{STYLE}</style>

      <div className="ka-sidebar">
        <div className="ka-sidebar-mark">RK</div>
        <button className={`ka-tab ${activeTab === 'kasir' ? 'active' : ''}`} onClick={() => setActiveTab('kasir')}>
          <Ico size={19}>🛒</Ico> Kasir
        </button>
        <button className={`ka-tab ${activeTab === 'produk' ? 'active' : ''}`} onClick={() => setActiveTab('produk')}>
          <Ico size={19}>📦</Ico> Produk
        </button>
        <button className={`ka-tab ${activeTab === 'riwayat' ? 'active' : ''}`} onClick={() => setActiveTab('riwayat')}>
          <Ico size={19}>🕘</Ico> Riwayat
        </button>
        <button className="ka-tab" style={{ marginTop: 'auto' }} onClick={() => { setSettingsForm(storeSettings); setShowSettings(true); }}>
          <Ico size={19}>⚙️</Ico> Toko
        </button>
      </div>

      <div className="ka-main">
        <div className="ka-topbar">
          <h1>
            {activeTab === 'kasir' && 'Kasir'}
            {activeTab === 'produk' && 'Produk'}
            {activeTab === 'riwayat' && 'Riwayat Transaksi'}
          </h1>
          <p>
            {activeTab === 'kasir' && 'Pilih produk untuk menambahkan ke keranjang'}
            {activeTab === 'produk' && 'Kelola daftar produk dan stok barang'}
            {activeTab === 'riwayat' && 'Rekap penjualan dan riwayat transaksi'}
          </p>
        </div>

        <div className="ka-body">
          {saveError && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, background: '#F5E1DD', color: '#A23B2E', padding: '10px 14px', borderRadius: 8, fontSize: 12.5, marginBottom: 16 }}>
              <Ico size={15}>⚠️</Ico> Sebagian data mungkin tidak tersimpan. Coba periksa koneksi penyimpanan Anda.
            </div>
          )}

          {activeTab === 'kasir' && (
            <div className="ka-kasir-grid">
              <div>
                <div className="ka-search-row">
                  <div className="ka-search-box">
                    <Ico size={15}>🔍</Ico>
                    <input placeholder="Cari produk..." value={search} onChange={e => setSearch(e.target.value)} />
                  </div>
                </div>
                <div className="ka-chips">
                  {categories.map(cat => (
                    <button key={cat} className={`ka-chip ${activeCategory === cat ? 'active' : ''}`} onClick={() => setActiveCategory(cat)}>
                      {cat}
                    </button>
                  ))}
                </div>

                {filteredProducts.length === 0 ? (
                  <div className="ka-empty-state">
                    <Ico size={34}>📦</Ico>
                    <p>{products.length === 0 ? 'Belum ada produk. Tambah produk dulu di tab Produk.' : 'Tidak ada produk yang cocok dengan pencarian.'}</p>
                  </div>
                ) : (
                  groupedProducts.map(group => (
                    <div key={group.category} className="ka-category-group">
                      <h3 className="ka-category-title">{group.category}</h3>
                      <div className="ka-product-grid">
                        {group.items.map(p => {
                          const inCart = cart.find(c => c.productId === p.id);
                          const availableStock = p.stock - (inCart ? inCart.qty : 0);
                          return (
                            <button key={p.id} className="ka-product-card" disabled={availableStock <= 0} onClick={() => addToCart(p)}>
                              <span className={`ka-stock-badge ${p.stock === 0 ? 'out' : p.stock < 5 ? 'low' : ''}`}>
                                {p.stock === 0 ? 'Habis' : `Stok ${p.stock}`}
                              </span>
                              <span className="name">{p.name}</span>
                              <span className="price mono">{formatRupiah(p.price)}</span>
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  ))
                )}
              </div>

              <div className="ka-cart">
                <h2><Ico size={17}>🛒</Ico> Keranjang</h2>
                {cart.length === 0 ? (
                  <div className="empty">Keranjang masih kosong.<br />Pilih produk di sebelah kiri untuk memulai transaksi.</div>
                ) : (
                  <>
                    <div className="ka-cart-items">
                      {cart.map(c => (
                        <div className="ka-cart-item" key={c.productId}>
                          <div className="info">
                            <div className="n">{c.name}</div>
                            <div className="p">{formatRupiah(c.price)} × {c.qty} = {formatRupiah(c.price * c.qty)}</div>
                          </div>
                          <div className="ka-qty-ctrl">
                            <button onClick={() => changeQty(c.productId, -1)}><Ico size={12}>➖</Ico></button>
                            <span>{c.qty}</span>
                            <button onClick={() => changeQty(c.productId, 1)} disabled={c.qty >= c.stock}><Ico size={12}>➕</Ico></button>
                          </div>
                          <button className="rm" onClick={() => removeFromCart(c.productId)}><Ico size={14}>🗑️</Ico></button>
                        </div>
                      ))}
                    </div>
                    <div className="ka-cart-summary">
                      <div className="ka-row"><span>Subtotal</span><span className="mono">{formatRupiah(cartTotal)}</span></div>
                      <input
                        className="ka-cash-input"
                        placeholder="Diskon (%)"
                        type="number"
                        value={discountInput}
                        onChange={e => setDiscountInput(e.target.value)}
                      />
                      {discountPercent > 0 && (
                        <div className="ka-row" style={{ color: '#B5502C' }}>
                          <span>Potongan ({discountPercent}%)</span>
                          <span className="mono">-{formatRupiah(discountAmount)}</span>
                        </div>
                      )}
                      <div className="ka-row total"><span>Total</span><span>{formatRupiah(finalTotal)}</span></div>
                      <input
                        className="ka-cash-input"
                        placeholder="Uang diterima (Rp)"
                        type="number"
                        value={cashInput}
                        onChange={e => setCashInput(e.target.value)}
                      />
                      {cashInput !== '' && (
                        <div className="ka-row" style={{ color: change < 0 ? '#A23B2E' : '#2F6F4E', fontWeight: 600 }}>
                          <span>{change < 0 ? 'Kurang' : 'Kembalian'}</span>
                          <span className="mono">{formatRupiah(Math.abs(change))}</span>
                        </div>
                      )}
                      <button className="ka-btn primary" disabled={!canCheckout} onClick={checkout}>
                        <Ico size={15}>💰</Ico> Selesaikan Transaksi
                      </button>
                    </div>
                  </>
                )}
              </div>
            </div>
          )}

          {activeTab === 'produk' && (
            <div>
              <div className="ka-produk-head">
                <h2>{products.length} produk terdaftar</h2>
                <button className="ka-btn primary" style={{ width: 'auto' }} onClick={openNewProduct}>
                  <Ico size={15}>➕</Ico> Tambah Produk
                </button>
              </div>

              {products.length === 0 ? (
                <div className="ka-empty-state">
                  <Ico size={34}>📦</Ico>
                  <p>Belum ada produk. Tambah produk pertama Anda.</p>
                </div>
              ) : (
                <div className="ka-table-wrap">
                  <table className="ka-table">
                    <thead>
                      <tr>
                        <th>Nama</th>
                        <th>Kategori</th>
                        <th>Harga</th>
                        <th>Stok</th>
                        <th></th>
                      </tr>
                    </thead>
                    <tbody>
                      {products.map(p => (
                        <tr key={p.id}>
                          <td style={{ fontWeight: 600 }}>{p.name}</td>
                          <td style={{ color: '#6B7268' }}>{p.category}</td>
                          <td className="price-cell">{formatRupiah(p.price)}</td>
                          <td>{p.stock}</td>
                          <td>
                            <div className="actions">
                              <button className="ka-icon-btn" onClick={() => openEditProduct(p)}><Ico size={14}>✏️</Ico></button>
                              <button className="ka-icon-btn del" onClick={() => deleteProduct(p.id)}><Ico size={14}>🗑️</Ico></button>
                            </div>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}

          {activeTab === 'riwayat' && (
            <div>
              <div className="ka-summary-row">
                <div className="ka-summary-card">
                  <div className="label"><Ico size={13}>📈</Ico> Transaksi Hari Ini</div>
                  <div className="value">{todaysTransactions.length}</div>
                </div>
                <div className="ka-summary-card">
                  <div className="label"><Ico size={13}>💰</Ico> Pendapatan Hari Ini</div>
                  <div className="value rust mono">{formatRupiah(todaysRevenue)}</div>
                </div>
                <div className="ka-summary-card">
                  <div className="label"><Ico size={13}>🧾</Ico> Total Semua Transaksi</div>
                  <div className="value">{transactions.length}</div>
                </div>
              </div>

              {itemSalesSummary.length > 0 && (
                <div style={{ marginBottom: 24 }}>
                  <h2 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 16, margin: '0 0 10px' }}>Terjual per Item</h2>
                  <div className="ka-table-wrap">
                    <table className="ka-table">
                      <thead>
                        <tr>
                          <th>Item</th>
                          <th>Hari Ini</th>
                          <th>Total Semua Waktu</th>
                        </tr>
                      </thead>
                      <tbody>
                        {itemSalesSummary.map(it => (
                          <tr key={it.name}>
                            <td style={{ fontWeight: 600 }}>{it.name}</td>
                            <td className="mono">{it.today} pcs</td>
                            <td className="mono" style={{ fontWeight: 600, color: 'var(--rust)' }}>{it.allTime} pcs</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {transactions.length === 0 ? (
                <div className="ka-empty-state">
                  <Ico size={34}>🕘</Ico>
                  <p>Belum ada transaksi.</p>
                </div>
              ) : (
                transactionsByDate.map(group => (
                  <div key={group.dateKey} className="ka-date-group">
                    <div className="ka-date-header">
                      <span>{group.label}</span>
                      <span className="mono">{group.items.length} transaksi · {formatRupiah(group.total)}</span>
                    </div>
                    <div className="ka-date-breakdown">
                      {group.itemBreakdown.map(it => (
                        <div className="ka-breakdown-row" key={it.name}>
                          <span className="n">{it.name}</span>
                          <span className="q mono">{it.qty} pcs</span>
                          <span className="t mono">{formatRupiah(it.total)}</span>
                        </div>
                      ))}
                    </div>
                    <div className="ka-trx-list">
                      {group.items.map(t => (
                        <div className="ka-trx-card" key={t.id} onClick={() => setExpandedTrx(expandedTrx === t.id ? null : t.id)}>
                          <div className="ka-trx-head">
                            <span className="id">#{t.id}</span>
                            <span className="total">{formatRupiah(t.total)}</span>
                          </div>
                          <div className="ka-trx-sub">{new Date(t.timestamp).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })} · {t.items.length} item</div>
                          {expandedTrx === t.id && (
                            <>
                              <div className="ka-trx-items">
                                {t.items.map((it, i) => (
                                  <div className="it" key={i}><span>{it.name} × {it.qty}</span><span>{formatRupiah(it.price * it.qty)}</span></div>
                                ))}
                              </div>
                              <div className="ka-trx-actions">
                                <button className="ka-btn secondary" onClick={(e) => { e.stopPropagation(); setLastTransaction(t); setShowReceipt(true); }}>
                                  <Ico size={13}>🖨️</Ico> Cetak Ulang
                                </button>
                              </div>
                            </>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                ))
              )}
            </div>
          )}
        </div>
      </div>

      {productModal && (
        <div className="ka-modal-overlay" onClick={closeProductModal}>
          <div className="ka-modal" onClick={e => e.stopPropagation()}>
            <h3>
              {productModal === 'new' ? 'Tambah Produk' : 'Edit Produk'}
              <button onClick={closeProductModal}><Ico size={18}>✖️</Ico></button>
            </h3>
            <div className="ka-field">
              <label>Nama Produk</label>
              <input value={pForm.name} onChange={e => setPForm({ ...pForm, name: e.target.value })} placeholder="Contoh: Kopi Sachet" />
            </div>
            <div className="ka-field-row">
              <div className="ka-field">
                <label>Harga (Rp)</label>
                <input type="number" value={pForm.price} onChange={e => setPForm({ ...pForm, price: e.target.value })} placeholder="0" />
              </div>
              <div className="ka-field">
                <label>Stok</label>
                <input type="number" value={pForm.stock} onChange={e => setPForm({ ...pForm, stock: e.target.value })} placeholder="0" />
              </div>
            </div>
            <div className="ka-field">
              <label>Kategori</label>
              <input value={pForm.category} onChange={e => setPForm({ ...pForm, category: e.target.value })} placeholder="Contoh: Minuman" />
            </div>
            <div className="ka-modal-actions">
              <button className="ka-btn secondary" onClick={closeProductModal}>Batal</button>
              <button className="ka-btn primary" onClick={submitProduct}>Simpan</button>
            </div>
          </div>
        </div>
      )}

      {showSettings && (
        <div className="ka-modal-overlay" onClick={() => setShowSettings(false)}>
          <div className="ka-modal" onClick={e => e.stopPropagation()}>
            <h3>
              Pengaturan Toko
              <button onClick={() => setShowSettings(false)}><Ico size={18}>✖️</Ico></button>
            </h3>
            <div className="ka-field">
              <label>Nama Toko</label>
              <input value={settingsForm.name} onChange={e => setSettingsForm({ ...settingsForm, name: e.target.value })} placeholder="Contoh: Toko Kopi Senja" />
            </div>
            <div className="ka-field">
              <label>Logo (muncul di struk)</label>
              {settingsForm.logo && (
                <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
                  <img src={settingsForm.logo} alt="logo" style={{ width: 48, height: 48, objectFit: 'contain', borderRadius: 8, border: '1px solid var(--border)' }} />
                  <button className="ka-btn ghost" onClick={() => setSettingsForm({ ...settingsForm, logo: null })}><Ico size={13}>🗑️</Ico> Hapus logo</button>
                </div>
              )}
              <input type="file" accept="image/*" onChange={handleLogoUpload} />
            </div>
            <div className="ka-modal-actions">
              <button className="ka-btn secondary" onClick={() => setShowSettings(false)}>Batal</button>
              <button className="ka-btn primary" onClick={submitSettings}>Simpan</button>
            </div>
          </div>
        </div>
      )}

      {showReceipt && lastTransaction && (
        <div className="ka-modal-overlay" onClick={() => setShowReceipt(false)}>
          <div className="ka-modal" onClick={e => e.stopPropagation()}>
            <h3>
              Struk Transaksi
              <button onClick={() => setShowReceipt(false)}><Ico size={18}>✖️</Ico></button>
            </h3>
            <div id="receipt-content">
              <div className="ka-receipt-head">
                {storeSettings.logo && <img src={storeSettings.logo} alt="logo" style={{ width: 44, height: 44, objectFit: 'contain', margin: '0 auto 6px' }} />}
                <div className="store">{storeSettings.name || 'Toko Saya'}</div>
                <div className="meta">{formatDateTime(lastTransaction.timestamp)}</div>
                <div className="meta">No. #{lastTransaction.id}</div>
              </div>
              <div className="ka-receipt-divider" />
              {lastTransaction.items.map((it, i) => (
                <div className="ka-receipt-line" key={i}>
                  <span>{it.name}<br /><span className="qp">{it.qty} × {formatRupiah(it.price)}</span></span>
                  <span>{formatRupiah(it.price * it.qty)}</span>
                </div>
              ))}
              <div className="ka-receipt-divider" />
              {lastTransaction.discountAmount > 0 && (
                <>
                  <div className="ka-receipt-line"><span>Subtotal</span><span>{formatRupiah(lastTransaction.subtotal)}</span></div>
                  <div className="ka-receipt-line"><span>Diskon ({lastTransaction.discountPercent}%)</span><span>-{formatRupiah(lastTransaction.discountAmount)}</span></div>
                </>
              )}
              <div className="ka-receipt-total-row"><span>Total</span><span>{formatRupiah(lastTransaction.total)}</span></div>
              <div className="ka-receipt-line"><span>Tunai</span><span>{formatRupiah(lastTransaction.cash)}</span></div>
              <div className="ka-receipt-line"><span>Kembali</span><span>{formatRupiah(lastTransaction.change)}</span></div>
              <div className="ka-receipt-divider" />
              <div style={{ textAlign: 'center', fontSize: 11.5, color: '#6B7268', marginTop: 10 }}>Terima kasih atas kunjungan Anda</div>
            </div>
            <div className="ka-modal-actions" style={{ flexWrap: 'wrap' }}>
              <button className="ka-btn secondary" onClick={() => setShowReceipt(false)}>Tutup</button>
              <button className="ka-btn secondary" onClick={shareOrSaveReceipt}><Ico size={15}>📤</Ico> Bagikan/Simpan</button>
              <button className="ka-btn primary" onClick={printReceipt}><Ico size={15}>🖨️</Ico> Cetak</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<KasirApp />);
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
